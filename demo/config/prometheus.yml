# 데모 속도. 운영(kube-prometheus-stack) 기본은 30s
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: api
    static_configs:
      - targets: [api:8000]
        labels: {namespace: maemusae, app: api, container: api}
  # /health/ready는 DB까지 확인한다. 쿠버네티스 readinessProbe 대신 blackbox로 본다
  - job_name: api-ready
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://api:8000/health/ready]
        labels: {namespace: maemusae, app: api, container: api}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: ops-api
    static_configs:
      - targets: [ops-api:8000]
