# 로컬 통합 데모. demo/up.sh가 이미지를 만든 뒤 이 파일을 올린다. 직접 쓸 때는 demo/lib.sh의 dc()처럼
# `docker compose -p watchnyang-demo -f demo/compose.yaml`로 부른다.
# WatchNyang api 컨테이너는 여기 없다. deployer가 로컬 gitops 저장소를 보고 띄운다(Argo CD 대역)
name: watchnyang-demo

x-ops: &ops
  image: watchnyang-ops:demo
  pull_policy: never
  environment:
    DATABASE_URL: postgresql://ops:ops@ops-postgres:5432/incident
    SECURITY_DATABASE_URL: postgresql://ops:ops@ops-postgres:5432/security
    REDIS_URL: redis://ops-redis:6379/0
    ALERTMANAGER_TOKEN: demo-alertmanager-token
    SECURITY_REPORT_TOKEN: demo-security-token
    # 같은 장애 지문은 이 시간 동안 다시 분석하지 않는다(운영 600초). 시나리오를 바로 다시 돌릴 수 있게 줄였다
    DEDUPE_TTL_SEC: "60"
    LOKI_URL: http://loki:3100
    INFRA_REPO_BACKEND: local-git
    CLI_APPROVAL_ENABLED: "true"
    INFRA_LOCAL_GIT_DIR: /gitops/infra.git
    INFRA_LOCAL_PR_URL: http://localhost:18000/local-gitops/pulls
    ROLLBACK_APPS: '["api"]'
    # lib.sh가 OPENAI_API_KEY가 있으면 openai 모델로, 없으면 가짜 LLM으로 정한다
    LIGHT_MODEL: ${LIGHT_MODEL:-fake:light}
    HEAVY_MODEL: ${HEAVY_MODEL:-fake:heavy}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
    DISCORD_INCIDENT_CHANNEL_ID: ${DISCORD_INCIDENT_CHANNEL_ID:-}
    DISCORD_SECURITY_CHANNEL_ID: ${DISCORD_SECURITY_CHANNEL_ID:-}
    DISCORD_APPROVER_ROLE_IDS: ${DISCORD_APPROVER_ROLE_IDS:-}
    # 24시는 오지 않으므로 보안 일일 보고를 끈다. scenarios/security-report.sh가 0으로 바꿔 바로 만든다
    SECURITY_REPORT_HOUR_KST: ${SECURITY_REPORT_HOUR_KST:-24}
  volumes:
    - gitops:/gitops

services:
  # WatchNyang(SERVICE) 쪽
  service-db:
    image: postgres:17
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
      POSTGRES_DB: starter
    volumes: [service-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U starter -d starter"]
      interval: 2s
      retries: 30

  service-migrate:
    image: watchnyang-api:v1
    pull_policy: never
    env_file: service.env
    command: ["sh", "-c", "alembic upgrade head && python -m app.users.seed"]
    depends_on:
      service-db: {condition: service_healthy}

  deployer:
    build: {context: images, dockerfile: deployer.Dockerfile}
    image: watchnyang-demo-deployer
    volumes:
      # 데모 전용. 이 컨테이너만 docker 소켓을 쓴다
      - /var/run/docker.sock:/var/run/docker.sock
      - gitops:/gitops
      - ./service.env:/demo/service.env:ro
    depends_on:
      service-migrate: {condition: service_completed_successfully}

  traffic:
    image: curlimages/curl:8.15.0
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          curl -s -o /dev/null http://api:8000/api/auth/terms
          curl -s -o /dev/null http://api:8000/health
          sleep 0.5
        done

  # 관측
  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./config/loki.yaml:/etc/loki/loki.yaml:ro
      - ./config/loki-rules:/etc/loki/rules:ro
    ports: ["13100:3100"]

  alloy:
    image: grafana/alloy:v1.10.2
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    volumes:
      - ./config/alloy.alloy:/etc/alloy/config.alloy:ro
      # 데모 전용. 컨테이너 로그를 읽으려고 소켓을 쓴다
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes: [./config/blackbox.yml:/etc/blackbox/blackbox.yml:ro]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus-rules.yml:/etc/prometheus/rules.yml:ro
    ports: ["19090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: [./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
    ports: ["19093:9093"]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/watchnyang-demo.json
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["13000:3000"]

  # OPS 쪽. 루트 docker-compose.yml과 같은 구성이고 이미지에 git만 더했다
  ops-redis:
    image: redis:7-alpine

  ops-postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: postgres
    volumes:
      - ops-db-data:/var/lib/postgresql/data
      - ../deploy/local/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d incident"]
      interval: 2s
      retries: 30

  ops-migrate:
    <<: *ops
    command: ["python", "-m", "app.db"]
    depends_on:
      ops-postgres: {condition: service_healthy}

  ops-api:
    <<: *ops
    ports: ["18000:8000"]
    depends_on:
      ops-redis: {condition: service_started}
      ops-migrate: {condition: service_completed_successfully}

  ops-worker:
    <<: *ops
    command: ["python", "-m", "app.worker"]
    depends_on:
      ops-redis: {condition: service_started}
      ops-migrate: {condition: service_completed_successfully}

  # DISCORD_BOT_TOKEN이 있을 때만 lib.sh가 discord 프로필을 켠다
  ops-approvals:
    <<: *ops
    command: ["python", "-m", "app.approvals"]
    profiles: [discord]
    depends_on:
      ops-migrate: {condition: service_completed_successfully}

networks:
  default:
    name: watchnyang-demo

volumes:
  gitops:
  service-db-data:
  ops-db-data:
