# 로컬 실행용. 운영 매니페스트는 INFRA 레포 gitops/에 둔다(docs/infra-requirements.md)
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # 큐 메시지가 재시작 뒤에도 남게 AOF를 켠다
    volumes: [redis-data:/data]
    ports: ["56379:6379"]

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_USER=ops
      - POSTGRES_PASSWORD=ops
      - POSTGRES_DB=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/local/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d incident"]
      interval: 2s
      retries: 30

  migrate:
    build: .
    env_file: .env
    environment: &local
      - DATABASE_URL=postgresql://ops:ops@postgres:5432/incident
      - SECURITY_DATABASE_URL=postgresql://ops:ops@postgres:5432/security
      - REDIS_URL=redis://redis:6379/0
    command: ["python", "-m", "app.db"]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: .
    env_file: .env
    environment: *local
    depends_on:
      redis: {condition: service_started}
      migrate: {condition: service_completed_successfully}
    ports: ["8000:8000"]

  worker:
    build: .
    env_file: .env
    environment: *local
    command: ["python", "-m", "app.worker"]
    depends_on:
      redis: {condition: service_started}
      migrate: {condition: service_completed_successfully}

  # DISCORD_BOT_TOKEN이 있을 때만 띄운다: docker compose --profile discord up -d
  approvals:
    build: .
    env_file: .env
    environment: *local
    command: ["python", "-m", "app.approvals"]
    profiles: [discord]
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  redis-data:
  postgres-data:
