# 데이터베이스가 둘(incident, security)이라 마이그레이션 디렉터리도 둘이다. python -m app.db가 둘 다 올린다
[alembic]
script_location = migrations/incident
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
